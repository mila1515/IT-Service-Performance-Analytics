# Thème sobre de l'outil d'analyse simple (lu car placé à côté de src/app.py).
[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F5FD1"
backgroundColor = "#F2F4F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2C3E50"
borderColor = "#DCE4ED"
linkColor = "#1F5FD1"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = 700
baseRadius = "0.75rem"
showWidgetBorder = true
