<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IT Service Performance">
  <!-- Pictogramme : jauge de performance (SLA) au-dessus d'une ligne de supervision. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fond)"/>
  <!-- Arc de la jauge : zone lente en blanc atténué, zone rapide en turquoise. -->
  <path d="M14 38 A18 18 0 0 1 50 38" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <path d="M32 20 A18 18 0 0 1 50 38" fill="none" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round"/>
  <!-- Aiguille. -->
  <line x1="32" y1="38" x2="43" y2="26" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="32" cy="38" r="3.5" fill="#FFFFFF"/>
  <!-- Ligne de supervision. -->
  <polyline points="12,50 22,50 26,45 31,54 35,47 39,50 52,50" fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
